name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full suite (Linux, Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      - name: Run every test
        run: pytest -q

  api:
    name: API suite (Windows, no Home Assistant)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Home Assistant cannot be installed here (homeassistant.runner imports
      # fcntl), which is exactly why api.py depends on nothing but requests.
      # conftest skips the platform tests and says so in the report header.
      - run: pip install pytest "requests>=2.31"

      - name: Run the tests that do not need Home Assistant
        run: pytest -q tests/test_api.py
